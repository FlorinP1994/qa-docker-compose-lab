services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qa_db
      POSTGRES_PASSWORD: qa_password
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d qa_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine

  adminer:
    image: adminer:latest
    ports:
      - "8888:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data: